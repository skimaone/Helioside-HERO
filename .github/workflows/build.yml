name: Windows x64 VST3
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: hero-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-vst3:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure MSVC x64 and JUCE 8.0.4
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON
      - name: Build Release VST3 and all supplied and integration tests
        run: |
          cmake --build build --config Release --parallel 2 2>&1 | Tee-Object -FilePath build/build-release.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run DSP, state, audio-thread, GUI, aliasing and native VST3 validation
        run: |
          ctest --test-dir build -C Release --output-on-failure --no-tests=error --output-junit test-results/ctest.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify AMD64 exports, stable identity and full bundle
        run: |
          python tools/ci/package_windows.py --bundle "build/HERO_artefacts/Release/VST3/Suntech Audio HERO.vst3" --output dist --revision "${{ github.sha }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload complete Windows VST3
        uses: actions/upload-artifact@v4
        with:
          name: SuntechAudioHERO-0.1.1-Windows-x64-VST3
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/download-artifact@v4
        with:
          name: SuntechAudioHERO-0.1.1-Windows-x64-VST3
          path: verify-download
      - name: Verify downloaded delivery
        run: |
          python tools/ci/package_windows.py --verify-download verify-download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload tests, measurements and GUI captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SuntechAudioHERO-0.1.1-Tests-and-GUI
          path: |
            build/test-results/
            build/Testing/Temporary/
            build/research/stability_metrics_v09.csv
            build/build-release.log
            verify-download/verified-delivery.json
          if-no-files-found: warn
          retention-days: 30
      - name: Upload matching crash symbols
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SuntechAudioHERO-0.1.1-Windows-Symbols
          path: |
            build/symbols/
            build/SuntechHero-Release.map
          if-no-files-found: error
          retention-days: 30
